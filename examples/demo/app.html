<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace — Notification settings demo</title>
<style>
/* Hallmark · component: settings form · tone: utilitarian · fixture only
 * after intentionally contains a mobile regression for visual review */
:root { --ink:#172d38; --muted:#526776; --paper:#fff; --canvas:#f2f5f7; --line:#cbd7dd; --accent:#146758; --tint:#eaf4f0; --font:system-ui,sans-serif; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--canvas); font:17px/1.6 var(--font); }
header { background:var(--paper); border-bottom:1px solid var(--line); padding:16px 32px; display:flex; justify-content:space-between; gap:24px; }
header strong { font-size:20px; } header span, .muted { color:var(--muted); }
main { max-width:900px; margin:32px auto; padding:0 24px; }
h1 { font-size:30px; line-height:1.3; margin:0 0 8px; } h2 { font-size:20px; margin:0 0 8px; }
h1,h2 { font-style:normal; overflow-wrap:anywhere; }
p { margin:0 0 20px; } form { padding:28px; background:var(--paper); border:1px solid var(--line); }
.rows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
label { display:block; font-weight:600; margin-bottom:20px; }
input,select { display:block; width:100%; margin-top:8px; border:1px solid var(--line); padding:11px 12px; border-radius:4px; font:inherit; color:var(--ink); background:var(--paper); }
.notifications { margin:8px 0 24px; padding:20px; background:var(--tint); border-left:4px solid var(--accent); }
.notifications p { color:var(--muted); margin-bottom:12px; }
.notifications label { margin:0; } .notifications input { display:inline; width:auto; margin:0 8px 0 0; }
.actions { display:flex; align-items:center; justify-content:space-between; gap:16px; border-top:1px solid var(--line); padding-top:20px; }
button { font:600 16px var(--font); border:0; background:var(--accent); color:var(--paper); padding:13px 24px; border-radius:4px; white-space:nowrap; cursor:pointer; }
button:hover { filter:brightness(.9); } button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
.note { margin:20px 0 0; font-size:13px; color:var(--muted); }
@media(max-width:640px) {
 header { padding:14px 18px; } header span { display:none; }
 main { margin:24px auto; padding:0 16px; } form { padding:20px; }
 .rows { grid-template-columns:minmax(0,1fr); gap:0; } h1 { font-size:25px; }
 .actions { align-items:stretch; flex-direction:column; } button { width:100%; }
 body[data-version="after"] form { width:600px; } /* Deliberate regression: save button is off-screen. */
 body[data-version="after"] .actions { flex-direction:row; }
 body[data-version="after"] button { width:190px; }
}
</style></head><body data-version="__VERSION__">
<header><strong>Workspace</strong><span>Demo workspace / Admin</span></header>
<main><h1>Workspace settings</h1><p class="muted">Manage your team details and notifications.</p>
<form onsubmit="event.preventDefault()">
<div class="rows"><label>Workspace name<input value="Design team" readonly></label>
<label>Language<select><option>English</option></select></label></div>
__NOTIFICATIONS__
<div class="actions"><span class="muted">Changes apply to everyone on your team</span><button type="submit">Save changes</button></div>
</form><p class="note">Demo data only. Saving does not call a backend.</p></main>
</body></html>
